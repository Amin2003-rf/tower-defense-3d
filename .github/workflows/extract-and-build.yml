
name: Extract Graphics Update and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP and replace project files
        shell: bash
        run: |
          ZIP_FILE="tower-defense-3d-graphics-update.zip"
          test -f "$ZIP_FILE" || { echo "ZIP file not found: $ZIP_FILE"; exit 1; }
          mkdir -p /tmp/graphics-update
          unzip -q "$ZIP_FILE" -d /tmp/graphics-update
          PROJECT_DIR="/tmp/graphics-update/tower-defense - Copy"
          test -f "$PROJECT_DIR/package.json" || { echo "Project folder or package.json not found in ZIP"; exit 1; }
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/' \
            "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          rm -f "$ZIP_FILE"

      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply graphics update project files"
            git push
          else
            echo "No file changes to commit"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"


      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-defense-graphics-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
